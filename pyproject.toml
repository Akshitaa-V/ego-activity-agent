[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egoagent"
version = "0.1.0"
description = "Multisensor egocentric activity recognition (PyTorch) with an LLM agent on top"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akshitaa Vijayakumar" }]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
video = ["opencv-python>=4.8"]
vlm = ["transformers>=4.40", "pillow"]

[project.scripts]
egoagent = "egoagent.cli:main"

[tool.setuptools.packages.find]
include = ["egoagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end run of the CLI (still under a minute)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "SIM108"]  # asserts are fine; explicit if/else kept where it reads better

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
